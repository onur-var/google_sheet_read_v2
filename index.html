<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISL2-Cabin P/N Katalog Programı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
 <div class="header-container">
  <div class="header-left">
    <h1>Cabin P/N Katalog Uygulaması</h1>
  </div>
  <div class="header-right">
    <button id="developer-btn" class="icon-btn" title="Geliştirici">👨‍💻</button>
    <button id="sheet-btn" class="icon-btn" title="Veri Sayfası">📊</button>
    <button id="mode-toggle-btn" class="icon-btn" title="Gece/Gündüz Modu">🌓</button>
  </div>
</div>
  <div id="app-container">
    <input id="search-box" placeholder="Malzeme veya Part No ara..." />
    <div id="filter-container">
      <select id="category-filter">
        <option value="">Tüm Kategoriler</option>
      </select>
      <select id="aircraft-filter">
        <option value="">Tüm Uçak Tipleri</option>
      </select>
    </div>
    <div id="loading-spinner">Yükleniyor...</div>
    <div id="catalog-container"></div>
  </div>
  <div id="developer-popup">Onur VAR</div>
  <script src="app.js"></script>
</body>
</html>
